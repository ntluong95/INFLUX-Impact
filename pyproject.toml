[project]
name = "influx-impact-classification"
version = "0.1.0"
description = "Pathogen news processing and topic exploration pipeline"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pandas>=2.0.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "pygooglenews>=0.1.2",
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "openai>=1.30.0",
  "pyarrow>=15.0.0",
  "readability-lxml>=0.8.1",
  "trafilatura>=1.9.0",
  "ipykernel>=6.0.0",
  "nbformat>=5.10.0",
  "nbclient>=0.10.0",
  "itables>=1.7.0",
  "scikit-learn>=1.8.0",
  "krippendorff>=0.8.2",
  "sentence-transformers>=5.2.3",
  "bertopic>=0.17.4",
  "umap-learn>=0.5.11",
  "hdbscan>=0.8.41",
  "urllib3<2.2",
  "charset-normalizer<4",
  "chardet<6",
]

[tool.uv]
package = false

[tool.pyrefly]
search-path = ["."]

[tool.ruff]
ignore = ["E402"]
