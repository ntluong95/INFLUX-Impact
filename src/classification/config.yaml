paths:
  url_registry_db: data/url_registry.sqlite
  raw_html_dir: data/raw_html
  logs_dir: data/logs

inspection:
  sample_rows: 5

deduplication:
  source: rss
  resolve_google_news: true
  resolver_timeout_seconds: 20
  resolver_workers: 6
  tracking_params:
    - gclid
    - fbclid
    - dclid
    - msclkid
    - mc_cid
    - mc_eid
    - igshid
    - vero_conv
    - vero_id
    - yclid
    - gbraid
    - wbraid
    - mkt_tok
    - cmpid
    - spm
    - ref
    - ref_src
    - sourceid

fetch:
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
  min_delay_seconds: 1.0
  max_delay_seconds: 3.0
  timeout_seconds: 20
  resolver_timeout_seconds: 20
  reuse_previous_results: true
  reuse_previous_failures: true
  max_retries: 3
  backoff_base_seconds: 1.5
  retry_http_statuses: [429, 500, 502, 503, 504]

extraction:
  prefer_parquet: true
  min_text_chars: 250
  fallback_trafilatura: true
  fallback_readability: true

classification:
  enabled: true
  resume_if_exists: true
  checkpoint_every: 10
  metrics_output_path: data/processed/classification_metrics.json
  target_name: Zika
  target_aliases:
    - Zika virus
  text_max_chars: 900
  per_article_parallel_models: 1
  per_model_parallel_requests: 2
  inter_article_delay_seconds: 0.0
  rationale_quality:
    max_attempts: 1
    min_words: 12
    max_words: 24
    require_template: true
    require_evidence_for_relevant: true

  aggregation:
    threshold: 0.75
    min_agreement: 0.67
    require_min_agreement: true
    confidence_semantics: auto
    weights:
      qwen: 1.0
      gemma: 1.0
      llama: 1.0

  validation:
    enabled: false
    labels_path: data/reference/relevance_labels.csv
    url_column: canonical_url
    label_column: relevant
    recall_floor: 0.75
    tune_weights: true
    weight_grid_step: 0.25
    threshold_grid: [0.65, 0.7, 0.75, 0.8, 0.85]
    min_agreement_grid: [0.34, 0.67, 1.0]
    ece_bins: 10

  deterministic_summary:
    enabled: false
    max_chars: 700
    max_sentences: 6
    keywords:
      - zika
      - microcefalia
      - microcephaly
      - gravidez
      - gestante
      - pregnancy
      - economy
      - economia
      - health system
      - policy
      - travel
      - inequality

  openai:
    api_key_env: OPENAI_API_KEY
    base_url: "http://127.0.0.1:11434/v1"
    timeout_seconds: 60
    max_retries: 1
    retry_backoff_seconds: 1.0
    rate_limit_per_minute: 0

  generation:
    temperature: 0.0
    max_tokens: 96

  models:
    - alias: qwen
      model_id: qwen2.5:7b
    - alias: gemma
      model_id: gemma2:2b
    - alias: llama
      model_id: llama3.1:8b
