paths:
  url_registry_db: data/url_registry.sqlite
  raw_html_dir: data/raw_html
  logs_dir: data/logs

inspection:
  sample_rows: 5

deduplication:
  source: rss
  resolve_google_news: true
  resolver_timeout_seconds: 20
  resolver_workers: 6
  tracking_params:
    - gclid
    - fbclid
    - dclid
    - msclkid
    - mc_cid
    - mc_eid
    - igshid
    - vero_conv
    - vero_id
    - yclid
    - gbraid
    - wbraid
    - mkt_tok
    - cmpid
    - spm
    - ref
    - ref_src
    - sourceid

fetch:
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
  min_delay_seconds: 1.0
  max_delay_seconds: 3.0
  timeout_seconds: 20
  resolver_timeout_seconds: 20
  reuse_previous_results: true
  reuse_previous_failures: true
  max_retries: 3
  backoff_base_seconds: 1.5
  retry_http_statuses: [429, 500, 502, 503, 504]

extraction:
  prefer_parquet: true
  min_text_chars: 250
  fallback_trafilatura: true
  fallback_readability: true

classification:
  enabled: true
  resume_if_exists: true
  checkpoint_every: 10
  text_max_chars: 800
  per_article_parallel_models: 1
  inter_article_delay_seconds: 0.0
  deterministic_summary:
    enabled: false
    max_chars: 700
    max_sentences: 6
    keywords:
      - zika
      - microcefalia
      - microcephaly
      - gravidez
      - gestante
      - pregnancy
      - economy
      - economia
      - health system
      - policy
      - travel
      - inequality

  openai:
    api_key_env: OPENAI_API_KEY
    base_url: "http://127.0.0.1:11434/v1"
    timeout_seconds: 60
    max_retries: 1
    retry_backoff_seconds: 1.0
    rate_limit_per_minute: 0

  generation:
    temperature: 0.0
    max_tokens: 32

  models:
    - alias: mistral
      model_id: mistral:latest
    - alias: zephyr
      model_id: zephyr:latest
    - alias: llama70b
      model_id: llama3.1:8b
