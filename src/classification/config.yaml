paths:
  url_registry_db: data/url_registry.sqlite
  raw_html_dir: data/raw_html
  logs_dir: data/logs

inspection:
  sample_rows: 5

deduplication:
  source: rss
  resolve_google_news: true
  resolver_timeout_seconds: 20
  resolver_workers: 6
  tracking_params:
    - gclid
    - fbclid
    - dclid
    - msclkid
    - mc_cid
    - mc_eid
    - igshid
    - vero_conv
    - vero_id
    - yclid
    - gbraid
    - wbraid
    - mkt_tok
    - cmpid
    - spm
    - ref
    - ref_src
    - sourceid

fetch:
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
  min_delay_seconds: 1.0
  max_delay_seconds: 3.0
  timeout_seconds: 20
  resolver_timeout_seconds: 20
  reuse_previous_results: true
  reuse_previous_failures: true
  max_retries: 3
  backoff_base_seconds: 1.5
  retry_http_statuses: [429, 500, 502, 503, 504]

extraction:
  prefer_parquet: true
  min_text_chars: 250
  fallback_trafilatura: true
  fallback_readability: true

classification:
  enabled: true
  cache_by_text_hash: true
  resume_if_exists: true
  checkpoint_every: 10
  text_max_chars: 1500
  min_text_chars_for_llm: 250
  per_article_parallel_models: 1
  prefilter_keywords:
    - microcef
    - microceph
    - gravidez
    - gestant
    - pregnan
    - guillain
    - econom
    - turis
    - travel
    - advis
    - emergenc
    - decret
    - policy
    - politic
    - hospital
    - sus
    - desigual
    - inequal
    - aborto
    - escola
    - educa
    - medo
    - panico
    - pânico
  prefilter_min_keyword_hits: 6
  prefilter_default_label: not_relevant
  prefilter_confidence: 0.95
  deterministic_summary:
    enabled: true
    max_chars: 1000
    max_sentences: 8
    keywords:
      - zika
      - microcefalia
      - microcephaly
      - gravidez
      - gestante
      - pregnancy
      - economy
      - economia
      - health system
      - policy
      - travel
      - inequality

  openai:
    api_key_env: OPENAI_API_KEY
    api_key_fallback: ollama
    allow_missing_api_key_for_local: true
    base_url: http://localhost:11434/v1
    timeout_seconds: 20
    max_retries: 1
    retry_backoff_seconds: 1.0

  generation:
    temperature: 0.0
    max_tokens: 96

  models:
    - alias: mistral_openorca
      model_id: mistral
    - alias: zephyr_beta
      model_id: zephyr
    - alias: llama3_70b
      model_id: llama3.1:8b
