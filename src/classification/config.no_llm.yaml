paths:
  url_registry_db: data/url_registry.sqlite
  raw_html_dir: data/raw_html
  logs_dir: data/logs
inspection:
  sample_rows: 5
deduplication:
  source: rss
  resolve_google_news: true
  resolver_timeout_seconds: 20
  resolver_workers: 6
  tracking_params:
  - gclid
  - fbclid
  - dclid
  - msclkid
  - mc_cid
  - mc_eid
  - igshid
  - vero_conv
  - vero_id
  - yclid
  - gbraid
  - wbraid
  - mkt_tok
  - cmpid
  - spm
  - ref
  - ref_src
  - sourceid
fetch:
  user_agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/122.0 Safari/537.36
  min_delay_seconds: 1.0
  max_delay_seconds: 3.0
  timeout_seconds: 20
  resolver_timeout_seconds: 20
  max_retries: 3
  backoff_base_seconds: 1.5
  retry_http_statuses:
  - 429
  - 500
  - 502
  - 503
  - 504
extraction:
  prefer_parquet: true
  min_text_chars: 250
  fallback_trafilatura: true
  fallback_readability: true
classification:
  enabled: true
  text_max_chars: 12000
  min_text_chars_for_llm: 1000000000
  deterministic_summary:
    enabled: false
    max_chars: 6000
    max_sentences: 20
    keywords:
    - zika
    - microcefalia
    - microcephaly
    - gravidez
    - gestante
    - pregnancy
    - economy
    - economia
    - health system
    - policy
    - travel
    - inequality
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: null
    timeout_seconds: 60
    max_retries: 1
    retry_backoff_seconds: 2.0
  generation:
    temperature: 0.0
    max_tokens: 500
  models:
  - alias: mistral_openorca
    model_id: gpt-4o-mini
  - alias: zephyr_beta
    model_id: gpt-4.1-mini
  - alias: llama3_70b
    model_id: gpt-5-mini
