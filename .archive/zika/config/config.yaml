query:
  term: zika
  language: en
  start_date: "2010-01-01"
  end_date: "2025-12-31"

rss:
  backend: "pygooglenews"
  lang: "en"
  country: "US"
  chunk_size_days: 1
  cache_format: "json"
  manifest_filename: "zika_rss_manifest.csv"
  request_sleep_seconds: 1.5
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 2.0
  max_backoff_seconds: 90
  checkpoint_every: 25
  accept_language: "en-US,en;q=0.9"
  force_refresh: false
  proxy_backend: "direct"
  http_proxy: ""
  https_proxy: ""
  scraping_bee_api_key: ""
  user_agent: "Mozilla/5.0 (compatible; INFLUX-Zika/1.0; +https://news.google.com/)"

headline_filter:
  checkpoint_every: 10
  similarity_threshold: 0.75
  confidence_default: 0.5
  prompt_max_words_rationale: 20
  deterministic_seed: 42
  sbert_model: "all-MiniLM-L6-v2"
  openai:
    model: "gpt-5-nano"
    base_url: ""
    use_batch: true
    batch_completion_window: "24h"
    batch_poll_seconds: 30
    temperature: 0
    max_tokens: 800
    timeout_seconds: 60
    max_retries: 3
  local:
    provider: "ollama"
    model: "deepseek-r1:14b"
    base_url: "http://127.0.0.1:11434"
    temperature: 0
    max_tokens: 200
    timeout_seconds: 120
    max_retries: 2

validation:
  sample_size: 120
  seed: 42

fulltext:
  input_action: "keep"
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 1.5
  rate_limit_per_second: 0.5
  min_text_words: 120
  checkpoint_every: 10
  user_agent: "Mozilla/5.0 (compatible; INFLUX-Zika-FullText/1.0)"

topic_model:
  input_csv: "data/final/zika_fulltext.csv"
  min_word_count: 120
  allowed_language_prefixes:
    - "en"
  allow_blank_language: true
  max_documents: 0
  max_words_per_document: 800
  embedding_models:
    - "all-MiniLM-L6-v2"
    - "BAAI/bge-base-en-v1.5"
  primary_embedding_model: "all-MiniLM-L6-v2"
  top_n_words: 10
  min_topic_size: 12
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  vectorizer_stop_words: "english"
  use_keybert_inspired: true
  reduce_frequent_words: true
  umap_neighbors: 15
  umap_components: 5
  umap_min_dist: 0.0
  pca_components: 5
  kmeans_clusters: 6
  dimensionality_reduction_variants:
    - "umap"
    - "pca"
  clustering_variants:
    - "hdbscan"
    - "kmeans"
  vectorizer_variants:
    - "basic_unigram"
    - "tuned_bigram"
  ctfidf_variants:
    - "standard"
    - "reduce_frequent"
    - "bm25_reduce_frequent"
  representation_variants:
    - "ctfidf_only"
    - "keybert_inspired"
    - "mmr_diverse"
  representation_mmr_diversity: 0.3
  impact_focus:
    enabled: true
    embedding_model: "all-MiniLM-L6-v2"
    n_clusters: 8
    umap_neighbors: 8
    umap_components: 5
    projection_neighbors: 10
    projection_min_dist: 0.05
    vectorizer_min_df: 3
    vectorizer_ngram_min: 1
    vectorizer_ngram_max: 3
    representation_variant: "mmr_diverse"
    representation_mmr_diversity: 0.5
    ctfidf_variant: "bm25_reduce_frequent"
    stopwords:
      - "zika"
      - "zikv"
      - "virus"
      - "viruses"
      - "infection"
      - "infections"
      - "infected"
      - "infectious"
      - "disease"
      - "diseases"
      - "viral"
      - "outbreak"
      - "outbreaks"
    seed_topics:
      - ["microcephaly", "congenital", "pregnancy", "fetal", "newborn", "birth defect"]
      - ["guillain barre", "neurologic", "brain damage", "memory deficits", "neural stem", "spinal cord"]
      - ["sexual transmission", "semen", "sperm", "testicular", "vaginal", "reproductive"]
      - ["vector control", "wolbachia", "aedes", "larvae", "traps", "insecticide"]
      - ["diagnostic", "pcr", "assay", "screening", "surveillance", "detection"]
      - ["vaccine", "antibody", "therapeutic", "antiviral", "immunity", "neutralizing"]
      - ["public health", "travel advisory", "cdc", "who", "risk", "emergency"]
  seed: 42
